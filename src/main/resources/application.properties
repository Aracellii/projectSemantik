# File ontologi (di dalam resources/)
ontologi.file=/mobil.owl

# Nama root class utama di OWL
ontologi.root-class=Mobil

# Nama class yang diabaikan saat menampilkan kategori
ontologi.ignored-classes=NamedIndividual,MobilBerdasarkanJenis

# Nama property untuk field utama tampilan
ontologi.property.nama=namaMobil
ontologi.property.merk=memilikiMerk
ontologi.property.bahan-bakar=memilikiBahanBakar
ontologi.property.penumpang=jumlahPenumpang
